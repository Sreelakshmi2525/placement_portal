<!-- jobs/templates/jobs/apply_for_job.html -->
{% extends 'main/base.html' %}

{% block title %}Apply for {{ job.title }}{% endblock %}

{% block content %}
<div class="row mb-4">
    <div class="col-md-12">
        <h1>Apply for {{ job.title }}</h1>
        <h4 class="text-muted">{{ job.company }}</h4>
    </div>
</div>

<div class="row">
    <div class="col-md-12">
        <div class="card">
            <div class="card-header">
                <h3>Application Form</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_cover_letter" class="form-label">Cover Letter</label>
                        <textarea name="cover_letter" id="id_cover_letter" class="form-control" rows="6" placeholder="Write a brief cover letter explaining why you're a good fit for this position..."></textarea>
                    </div>
                    
                    <div class="mb-3">
                        <button type="submit" class="btn btn-primary">Submit Application</button>
                        <a href="{% url 'student_job_detail' job.id %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
